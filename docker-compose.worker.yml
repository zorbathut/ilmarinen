# Worker for the dev stack — shares the server's Compose network, so it only works on the server's host.
# To run a worker on a separate host, use deploy/worker-docker/ instead.
services:
  worker:
    build:
      context: .
      dockerfile: src/Ilmarinen.Worker/Dockerfile
    # A worker stopped mid-job cancels it, kills the step containers and reports the result before exiting; Docker's 10s default would SIGKILL it partway, orphaning the containers and leaving the job Running. Must exceed the worker's own shutdown budget (WorkerShutdownTimeout in src/Ilmarinen.Worker/Program.cs).
    stop_grace_period: 30s
    environment:
      ILMARINEN_SERVER_URL: http://server:8081
      # Set after registering a worker via the server UI or POST /api/workers
      ILMARINEN_WORKER_KEY: "register-worker-on-server-first"
      ILMARINEN_WORKSPACE_PATH: /data/workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-workspace:/data/workspaces

volumes:
  worker-workspace:
