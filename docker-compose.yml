services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ilmarinen
      POSTGRES_PASSWORD: ilmarinen
      POSTGRES_DB: ilmarinen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmarinen"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: src/Ilmarinen.Server/Dockerfile
    ports:
      - "1551:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=ilmarinen;Username=ilmarinen;Password=ilmarinen
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Ilmarinen.Worker/Dockerfile
    command: ["--server", "http://server:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-workspace:/tmp/ilmarinen-worker
    depends_on:
      - server

volumes:
  pgdata:
  worker-workspace:
