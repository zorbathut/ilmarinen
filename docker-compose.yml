# The local DEV STACK: builds from source, keys come from the gitignored docker-compose.override.yml,
# and the layered overlays (worker, discord) are chained via COMPOSE_FILE in .env.
# This is not a deployment — for a real server, see deploy/server-docker/.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ilmarinen
      POSTGRES_PASSWORD: ilmarinen
      POSTGRES_DB: ilmarinen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmarinen"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: src/Ilmarinen.Server/Dockerfile
    ports:
      # Only expose public port externally; worker port (8081) is internal only
      - "1551:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=ilmarinen;Username=ilmarinen;Password=ilmarinen
      Server__PublicPort: 8080
      Server__WorkerPort: 8081
      # IMPORTANT: Replace with a real 32-byte base64 key before production use
      # Generate with: openssl rand -base64 32
      # Used for worker authentication (ECDSA) and credential encryption (AES via HKDF)
      ILMARINEN_SERVER_KEY: "REPLACE-ME-WITH-REAL-KEY-GENERATED-VIA-openssl-rand-base64-32"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  artifacts:
