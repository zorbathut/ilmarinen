services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ilmarinen
      POSTGRES_PASSWORD: ilmarinen
      POSTGRES_DB: ilmarinen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmarinen"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: src/Ilmarinen.Server/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    ports:
      # Only expose public port externally; worker port (8081) is internal only
      - "1551:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=ilmarinen;Username=ilmarinen;Password=ilmarinen
      Server__PublicPort: 8080
      Server__WorkerPort: 8081
      # IMPORTANT: Replace with a real 32-byte base64 key before production use
      # Generate with: openssl rand -base64 32
      # Used for worker authentication (ECDSA) and credential encryption (AES via HKDF)
      ILMARINEN_SERVER_KEY: "REPLACE-ME-WITH-REAL-KEY-GENERATED-VIA-openssl-rand-base64-32"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: src/Ilmarinen.Worker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    command: ["--server", "http://server:8081"]
    environment:
      # Set after registering a worker via the server UI or POST /api/workers
      ILMARINEN_WORKER_KEY: "register-worker-on-server-first"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-workspace:/tmp/ilmarinen-worker
    depends_on:
      server:
        condition: service_healthy

  discord-bot:
    build:
      context: .
      dockerfile: src/Ilmarinen.DiscordBot/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    profiles:
      - discord
    environment:
      ILMARINEN_SERVER_URL: http://server:8080
    volumes:
      - ./config:/app/config:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  worker-workspace:
  artifacts:
