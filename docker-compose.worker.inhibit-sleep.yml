# Overlay for the dev stack's worker, for a Linux host that suspends when idle.
#
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.worker.inhibit-sleep.yml up -d
#
# See deploy/worker-docker/docker-compose.inhibit-sleep.yml for what this does, and for the lid-close,
# Docker Desktop, SELinux and no-D-Bus caveats before using it.
services:
  worker:
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
